services:
  postgres-measurements:
    image: postgres:17
    profiles: [measurements]
    environment:
      POSTGRES_USER: measurement
      POSTGRES_PASSWORD: local-measurement-only
      POSTGRES_DB: inz_measurements
    ports:
      - "5434:5432"
    volumes:
      - postgres_measurements_data:/var/lib/postgresql/data
  postgres:
    image: postgres:17
    container_name: inzynierka_v1
    restart: unless-stopped
    environment:
      POSTGRES_USER: damiano
      POSTGRES_PASSWORD: qwerty
      POSTGRES_DB: inzynierka_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_panel_inz
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: damian@inz.com
      PGADMIN_DEFAULT_PASSWORD: postgres
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_measurements_data:
  postgres_data:
